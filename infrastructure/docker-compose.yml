version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: flood_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: flood_warning_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flood_warning_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: flood_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/flood_warning_db
      - DEBUG=true
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
